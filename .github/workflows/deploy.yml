name: CI/CD Pipeline Zabbix

# Aciona a pipeline quando houver um push na branch main
on:
  push:
    branches:
      - main

# Variáveis de ambiente globais
env:
  HARBOR_REGISTRY: "localhost"
  HARBOR_PROJECT: "monitoramento"
  IMAGE_NAME: "zabbix-custom"
  # O github.sha pega o hash do commit para criar uma tag única
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # -------------------------------------------------------------------
  # JOB 1: Teste
  # -------------------------------------------------------------------
  test:
    name: Teste de Configuração
    runs-on: self-hosted
    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Validar sintaxe do Dockerfile
        run: |
          echo "Iniciando testes de validação..."
          # Usa um container pronto para testar o Dockerfile, sem precisar instalar nada no WSL
          docker run --rm -i hadolint/hadolint < Dockerfile

      - name: Validar sintaxe do docker-compose
        run: docker compose config -q

  # -------------------------------------------------------------------
  # JOB 2: Build
  # -------------------------------------------------------------------
  build:
    name: Build e Push da Imagem
    runs-on: self-hosted
    needs: test # Só executa se o teste passar
    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Build da imagem Docker customizada
        run: |
          docker build -t $HARBOR_REGISTRY/$HARBOR_PROJECT/$IMAGE_NAME:${IMAGE_TAG::7} .
          docker tag $HARBOR_REGISTRY/$HARBOR_PROJECT/$IMAGE_NAME:${IMAGE_TAG::7} $HARBOR_REGISTRY/$HARBOR_PROJECT/$IMAGE_NAME:latest

      - name: Login no Harbor Local
        run: |
          echo "${{ secrets.HARBOR_PASSWORD }}" | docker login $HARBOR_REGISTRY -u "${{ secrets.HARBOR_USER }}" --password-stdin

      - name: Push para o Harbor
        run: |
          docker push $HARBOR_REGISTRY/$HARBOR_PROJECT/$IMAGE_NAME:${IMAGE_TAG::7}
          docker push $HARBOR_REGISTRY/$HARBOR_PROJECT/$IMAGE_NAME:latest
          
      - name: Limpeza de imagem local após o build
        run: docker rmi $HARBOR_REGISTRY/$HARBOR_PROJECT/$IMAGE_NAME:${IMAGE_TAG::7}

  # -------------------------------------------------------------------
  # JOB 3: Deploy
  # -------------------------------------------------------------------
  deploy:
    name: Deploy do Zabbix
    runs-on: self-hosted
    needs: build # Só executa se o build passar
    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Login no Harbor Local
        run: |
          echo "${{ secrets.HARBOR_PASSWORD }}" | docker login $HARBOR_REGISTRY -u "${{ secrets.HARBOR_USER }}" --password-stdin

      - name: Pull da nova imagem
        run: docker pull $HARBOR_REGISTRY/$HARBOR_PROJECT/$IMAGE_NAME:latest

      - name: Deploy com Docker Compose
        run: |
          # Exporta a variável para o docker-compose.yml saber qual imagem puxar
          export ZABBIX_IMAGE="$HARBOR_REGISTRY/$HARBOR_PROJECT/$IMAGE_NAME:latest"
          docker compose down
          docker compose up -d