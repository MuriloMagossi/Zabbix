version: '3.5'

services:
  # 1. Banco de Dados PostgreSQL
  postgres-server:
    image: postgres:14-alpine
    environment:
      - POSTGRES_USER=zabbix
      - POSTGRES_PASSWORD=zabbix_pwd
      - POSTGRES_DB=zabbix
    volumes:
      # AQUI ESTÁ A MUDANÇA: Agora usamos um volume gerenciado pelo Docker
      - zabbix-db-data:/var/lib/postgresql/data
    networks:
      - zabbix-net

  # 2. Servidor Zabbix
  zabbix-server:
    image: ${ZABBIX_IMAGE:-zabbix/zabbix-server-pgsql:latest}
    environment:
      - DB_SERVER_HOST=postgres-server
      - POSTGRES_USER=zabbix
      - POSTGRES_PASSWORD=zabbix_pwd
      - POSTGRES_DB=zabbix
    ports:
      - "10051:10051"
    networks:
      - zabbix-net
    depends_on:
      - postgres-server

  # 3. Interface Web do Zabbix
  zabbix-web-nginx-pgsql:
    image: zabbix/zabbix-web-nginx-pgsql:latest
    environment:
      - ZBX_SERVER_HOST=zabbix-server
      - DB_SERVER_HOST=postgres-server
      - POSTGRES_USER=zabbix
      - POSTGRES_PASSWORD=zabbix_pwd
      - POSTGRES_DB=zabbix
      - PHP_TZ=America/Sao_Paulo
    ports:
      - "8080:8080"
    networks:
      - zabbix-net
    depends_on:
      - postgres-server
      - zabbix-server

networks:
  zabbix-net:
    driver: bridge

# AQUI DECLARAMOS O VOLUME PARA O DOCKER GERENCIAR
volumes:
  zabbix-db-data: